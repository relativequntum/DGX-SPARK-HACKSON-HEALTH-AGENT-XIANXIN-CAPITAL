name: Rebuild issue board

on:
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  board:
    # 仓库公开后，只有仓库所有者/成员/协作者发起的 Issue 或评论才触发（本 job 有 contents: write，
    # 不让外部账号靠开 Issue、发评论反复触发 bot 提交）；手动触发不受限。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issues' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    # 并发组放在 job 级：被上面 if 跳过的运行不会占组、也不会取消正在进行的看板更新
    concurrency:
      group: issue-board
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const members = [
              ['relativequntum', '史静宇'],
              ['keshunchen', '陈科顺'],
              ['ari1206', '曹昶皓'],
              ['hongyu', '李虹雨（登录名待确认）']
            ];
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const realIssues = issues.filter(item => !item.pull_request);
            const commentsByIssue = new Map();
            for (const issue of realIssues) {
              commentsByIssue.set(issue.number, await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: issue.number, per_page: 100 }
              ));
            }
            const esc = text => (text || '').replace(/\r?\n/g, ' ').replace(/\|/g, '\\|');
            const row = (issue, status) => {
              const labels = issue.labels.map(x => typeof x === 'string' ? x : x.name).join(', ');
              return `| #${issue.number} | [${esc(issue.title)}](${issue.html_url}) | ${status} | ${esc(labels)} |`;
            };
            let md = '# Issue 协作看板\n\n';
            md += '> 由 GitHub Actions 自动生成。正式上下文以 Issue 全文和评论为准。\n\n';
            md += `更新时间：${new Date().toISOString()}\n\n`;
            md += '## 按人待办\n\n';
            for (const [login, name] of members) {
              const mention = new RegExp(`@${login}\\b`, 'i');
              const related = realIssues.filter(issue => {
                const comments = commentsByIssue.get(issue.number) || [];
                return issue.user.login.toLowerCase() === login.toLowerCase()
                  || issue.assignees.some(a => a.login.toLowerCase() === login.toLowerCase())
                  || mention.test(issue.body || '')
                  || comments.some(c => mention.test(c.body || ''));
              });
              md += `### @${login}（${name}）\n\n`;
              if (!related.length) {
                md += '- 暂无开放事项。\n\n';
                continue;
              }
              md += '| Issue | 标题 | 状态 | 标签 |\n|---|---|---|---|\n';
              for (const issue of related) {
                const comments = commentsByIssue.get(issue.number) || [];
                const own = comments.filter(c => c.user.login.toLowerCase() === login.toLowerCase());
                const last = comments.at(-1);
                let status = '你已回应，等待对方';
                if (!own.length) status = '待你首次回应';
                else if (last && last.user.login.toLowerCase() !== login.toLowerCase()) status = `有新动态待你看（最后发言 @${last.user.login}）`;
                md += row(issue, status) + '\n';
              }
              md += '\n';
            }
            md += '## 全部开放 Issue\n\n';
            if (!realIssues.length) md += '- 暂无开放 Issue。\n';
            else {
              md += '| Issue | 标题 | 提出方 | 标签 |\n|---|---|---|---|\n';
              for (const issue of realIssues.sort((a, b) => a.number - b.number)) {
                const labels = issue.labels.map(x => typeof x === 'string' ? x : x.name).join(', ');
                md += `| #${issue.number} | [${esc(issue.title)}](${issue.html_url}) | @${issue.user.login} | ${esc(labels)} |\n`;
              }
            }
            fs.mkdirSync('docs', { recursive: true });
            fs.writeFileSync('docs/看板.md', md, 'utf8');
      - name: Commit board update
        run: |
          if git diff --quiet -- docs/看板.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/看板.md
          git commit -m "docs(board): 自动更新 Issue 看板"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
