name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required initialization files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f AGENTS.md
          test -f LICENSE
          test -f .github/CODEOWNERS
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f docs/roadmap.md
          test -f docs/safety-and-privacy.md
          test -f apps/text_triage/README.md
          test -f apps/multimodal/README.md
          test -f apps/emotion/README.md
