name: 会签
description: 多方对齐接口、口径、方案或医疗内容
labels: ["type:consultation"]
title: "[会签] "
body:
  - type: markdown
    attributes:
      value: "请确保不包含真实患者信息。代表本人立场的最终评论须经本人确认。"
  - type: input
    id: proposer
    attributes: {label: 提出方, placeholder: "@github-login"}
    validations: {required: true}
  - type: textarea
    id: context
    attributes: {label: 背景与待对齐问题, description: "说明为什么需要会签，以及不解决的影响。"}
    validations: {required: true}
  - type: textarea
    id: signers
    attributes: {label: 会签方, placeholder: "- [ ] @member-a\n- [ ] @member-b"}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: 建议方案, description: "包括接口、数据、医疗安全和隐私影响。"}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: 达成一致的判断标准}
    validations: {required: true}
  - type: textarea
    id: conclusion
    attributes: {label: 结论（关闭前由提出方填写）}
